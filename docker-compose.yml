name: classpulse
services:
  db:
    image: mariadb:10.11
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: classpulse_local_root
      MARIADB_DATABASE: classpulse
      MARIADB_USER: classpulse
      MARIADB_PASSWORD: classpulse_local
    ports:
      - "127.0.0.1:${CLASSPULSE_DB_PORT:-33061}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLASSPULSE_WEB_PORT:-8090}:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: ["sh", "-c", "until php artisan --version >/dev/null 2>&1; do sleep 2; done; exec php artisan serve --host=0.0.0.0 --port=8000"]
  jstest:
    image: node:24-alpine
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
    command: ["node", "--test", "tests/js/*.test.js"]
volumes:
  db_data:
